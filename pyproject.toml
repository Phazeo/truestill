# truestill workspace root (virtual: no [project] of its own).
# Members are the real packages under packages/*. Shared tooling config lives here so it
# applies uniformly across every member; each member's pyproject carries only its own
# [project] metadata and build config.

[tool.uv.workspace]
members = ["packages/*"]

# Development dependencies for the whole workspace. Usage: uv sync --all-packages --group dev
#
# **A FLOOR MEANS TESTED-AT, NOT THOUGHT-TO-WORK.** Every `>=` here is a claim that the suite has
# run against that version; a lower one claims support for something nothing has ever executed.
# Raise a floor to the locked version when you bump it - `test_dependency_floors.py` refuses
# otherwise, and it caught `pytest-xdist>=3.6.1` against a lockfile pinning 3.8.0 on the day the
# dependency was added.
[dependency-groups]
dev = [
    "ruff>=0.16.0",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    # Parallel test execution. Measured on this suite: 1,968 tests, 89.95s serial -> 30.00s at
    # `-n auto` on 16 cores, zero failures. It is safe here for a reason that predates it: the
    # root `conftest.py` already gives every test a data/cache root no other test can name, and
    # a session-scoped version of that was tried and REJECTED because it let tests into each
    # other's state. There is no session- or module-scoped fixture anywhere in the suite. So
    # xdist's classic failure - two workers sharing a temp dir - is the exact thing this repo
    # engineered against for an unrelated reason.
    # NOT applied to the collection-order pass: see the Makefile's `test-order`.
    "pytest-xdist>=3.8.0",
    "prek==0.5.7",
    # Read by tests that parse .pre-commit-config.yaml and the CI workflows. Declared here because it used to
    # arrive only through pre-commit, which prek replaced.
    "pyyaml>=6.0.3",
    # Starlette TestClient (truestill-app tests). httpx2 rather than httpx: httpx has had no
    # release since 2024 with issues and discussions closed, Pydantic maintains httpx2 as its
    # continuation, and starlette.testclient now tries `import httpx2` first and warns on the
    # fallback. Not a preference - the warning is starlette telling every consumer where this
    # goes. httpx itself used to remain INSTALLED as a transitive dependency of briefcase; with
    # briefcase removed on 2026-08-15 it is gone from the environment entirely - it was the only
    # package in the lock that declared it, checked rather than assumed, and nothing here imports
    # plain `httpx`. Nothing changes for truestill either way: it neither declares nor relies on it.
    # ⚠ FLOOR RAISED 2026-09-09, and the floor is the fix rather than the lock pin: five CVEs
    # land on 2.9.1 - CVE-2026-84378/84379/84380/84382 (httpx2) and CVE-2026-84381 (httpcore2) -
    # fixed across 2.10.0, 2.11.0 and 2.12.0, so 2.12.0 is the first version clear of all five.
    # A lock bump alone would be undone by the next `uv lock` that resolves the old floor.
    "httpx2>=2.12.0",
    # Browser E2E (tests/e2e). The only tool that can execute the client-side JS layer, where
    # every UI bug the soak found actually lived -- a layer pytest alone cannot reach and
    # manual checking cannot regression-pin. Dev group only: it is never a runtime dependency
    # of truestill-core/-cli/-app, and a clean install of any of them pulls no browsers.
    "pytest-playwright>=0.8.0",
    # THE BUILD-ONLY bundler. Dev group, never a runtime dependency: it produces an artifact and
    # is absent from it. Per the ruling of 2026-07-31, a build tool that never enters the runtime
    # graph does not carry the §4 written-justification burden a shipped dependency does - it
    # ships to nobody, enters no user's security surface, and is deleted with the job that uses
    # it. Gated by `tests/e2e/test_dependency_gating.py` so it cannot drift into a shipped package.
    #
    # ⚠ There were TWO here until 2026-08-15. `briefcase>=0.4.4` went with the `(aad)` measurement
    # rig, and it was REFUTED rather than abandoned: `briefcase linux system` links against the
    # distro's Python and fails `requires-python` outright - pip's own words, `3.12.3 not in
    # '>=3.13'`. D9 publishes two platforms and briefcase produces nothing on one of them, so the
    # comparison it existed to run is settled and cannot be reopened by preference. The last
    # clause above ("deleted with the job that uses it") is the rule being applied, not waived.
    "pyinstaller>=6.21.0",
    # PE reader for `packaging/verify_icon.py`, which asserts the SHIPPED executable carries the
    # mark in `brand/`. It already arrives transitively with PyInstaller (win32 only), and §7's
    # rule is that what we import, we declare - the numpy row's exact reasoning, since a
    # transitive dependency we call directly is one the parent could bound or drop underneath us.
    # DECLARED WITHOUT A MARKER on purpose: `test_dependency_floors` anchors its spec pattern with
    # `$`, so `; sys_platform == 'win32'` would make the floor unreadable to the guard that keeps
    # it honest. The wheel is 75 KB and pure Python, and having it everywhere is what lets the
    # parser test run on all three lanes rather than only on Windows.
    "pefile>=2024.8.26",
    # A JSON Schema EMITTER for the payload contract (`scripts/emit_openapi.py`, `(ahn)` stage C),
    # not a model layer: it defines no model, validates nothing, and the app never imports it.
    # `packages/truestill-app/pyproject.toml` refuses Pydantic *for our models*; this is not that.
    "msgspec>=0.21.1",
]

# --- Ruff (lint + format), applied repo-wide ------------------------------------------
[tool.ruff]
line-length = 100
# Matches `requires-python`. ⚠ **THE FORMATTER IS PINNED A VERSION BEHIND THIS, ON PURPOSE**, by
# `--target-version py313` on every `ruff format` invocation - the Makefile, CI, and the
# pre-commit hook. See the block below `[tool.ruff.format]`.
target-version = "py314"

# --- Why the formatter is pinned to py313 ----------------------------------------------
#
# ⚠ **THIS REPO DOES NOT ADOPT PEP 758, AND THAT IS A FORMATTING PREFERENCE RATHER THAN A CLAIM
# THAT THE PEP IS WRONG.** At `py314` the formatter rewrites `except (A, B):` into `except A, B:`,
# which is valid and two characters shorter. It is also **visually identical to Python 2's
# `except E, name:`**, which BOUND the exception to a name rather than catching two of them. A
# reader who learned Python 2 reads `except OSError, ValueError:` as "catch OSError as
# ValueError". Unambiguous to the interpreter, ambiguous to a person, for two characters.
#
# ⚠ **A FUTURE READER SHOULD NOT UNDO THIS ON TIDINESS GROUNDS.** "The formatter flag disagrees
# with target-version" is the intended state, not drift.
#
# **There is no configuration key for this.** Measured 2026-08-22 against ruff 0.16.0 and 0.16.4
# (latest): `[tool.ruff.format]` rejects any such key, and the rewrite is the *formatter*, gated
# purely on `target-version >= py314` - no lint rule performs it. Upstream has it reported many
# times over (astral-sh/ruff #23090, #23467, #23626, #23793, #24041, #25065, #25901, #25923,
# introduced in 0.15.0); the issues are closed and the behaviour is unchanged in the latest
# release, so the CLI flag is the only lever that exists.
#
# ⚠ **AND THE FLAG ALONE IS NOT ENFORCEABLE, WHICH IS WHY A TEST GUARDS IT.** Measured: a file
# that already contains `except A, B:` passes `ruff format --check --target-version py313` -
# it reports *"1 file already formatted"* and exits 0. So an editor formatting on save reads
# `py314` from this file, rewrites, and nothing here objects.
# `test_the_formatter_is_pinned_behind_the_target.py` is what makes the rule real: it asserts
# every invocation carries the flag, and that no tracked source has the unparenthesised form.
#
# ⚠ **SO USE `make format`, NEVER A BARE `ruff format`.** That is not advice, it is the observed
# failure: writing this very guard involved formatting the test file by hand, which rewrote it,
# and the guard then caught itself in CI. An editor with format-on-save does the same thing.

[tool.ruff.lint]
select = [
    "E", "F", "I", "N", "W", "UP", "B", "C4", "DTZ", "T10", "EM", "ISC", "ICN", "G",
    "PIE", "T20", "PYI", "PT", "Q", "RSE", "RET", "SIM", "ARG", "PTH", "ERA", "PGH",
    "PL", "TRY", "RUF",
]
ignore = ["E501"]  # Line too long - handled by formatter
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
# CLI - stdout IS the output mechanism for the decision report
"packages/truestill-cli/src/truestill_cli/cli.py" = [
    "T201",    # print() is intentional here
    "PLR0913", # report/render helpers take many display flags
    "PLR0915", # argparse builder lists every subcommand flag in one place
    # _cmd_ingest refuses early and separately for each precondition - not a source, not a
    # directory, in-place without room, no media found. Each returns its own exit code with its
    # own message, which is the point: collapsing them would make one refusal stand for several.
    "PLR0911",
]
# Event review is CLI-facing: it prints prompts/tables to the terminal.
"packages/truestill-cli/src/truestill_cli/events_review.py" = [
    "T201",    # print()/input() are the interaction mechanism
    "PLR0913", # run_event_stage forwards resolutions/metadata/catalog/apply/prompt/template
]
# The event stage orchestrates several opt-in knobs (prompt, template) as keyword-only args.
"packages/truestill-core/src/truestill_core/event_review.py" = [
    "PLR0913", # run_event_stage(resolutions/metadata/catalog/apply/prompt/template)
]
# extract_archive_set takes four keyword-only opt-ins beyond its two positionals: a budget
# override for tests, an entry hook, and the progress/cancel pair every long job here carries.
# Bundling them into an options object would hide the pair that the job machinery expects.
"packages/truestill-core/src/truestill_core/archive_extract.py" = [
    "PLR0913", # extract_archive_set(set/destination + budget/on_entry/progress/cancel)
]
# Event clustering exposes several tunables as keyword-only knobs.
"packages/truestill-core/src/truestill_core/events.py" = [
    "PLR0913", # cluster_camera(sensitivity/window/min_files/min_duration/gps_jump)
]
# Catalog - a persisted row has many columns; keyword-only args name them at the call site
"packages/truestill-core/src/truestill_core/catalog.py" = [
    "PLR0913", # record_uploaded mirrors the table columns
]
# Organizer - execute() coordinates several opt-in behaviours via keyword-only flags
"packages/truestill-core/src/truestill_core/organizer.py" = [
    "PLR0913", # execute() and its write-path helpers take many keyword-only opt-in flags
]
# verify_token refuses separately for each way a licence file can be wrong - wrong shape, bad
# base64, non-JSON, unknown key, bad signature, unreadable fields - and each return carries its
# own wording. Collapsing them would make one refusal stand for several, which is the exact
# argument `_cmd_ingest` above is exempted on, one surface over.
"packages/truestill-core/src/truestill_core/licence.py" = ["PLR0911"]
# `_copy_one` declines separately for each way one file can be left alone - damaged on the drive,
# not on the drive at all, already in the library, staging failed, the staged bytes did not match,
# the commit failed. Each is a different fact the run reports by name, and each is a different
# remedy; collapsing them would make one skip stand for several, which is the same argument as the
# two above. `(aku)` added the first of them.
"packages/truestill-core/src/truestill_core/recover.py" = ["PLR0911"]
# scan.compute_hashes / verify.verify_copies expose pool/workers/progress/cancel as kw-only.
"packages/truestill-core/src/truestill_core/scan.py" = ["PLR0913"]
"packages/truestill-core/src/truestill_core/verify.py" = ["PLR0913"]
# organize_preview / organize_run forward progress/cancel/refresh_metadata as keyword-only knobs.
"packages/truestill-app/src/truestill_app/service/organize.py" = ["PLR0913"]
# Same shape one module over: _resolve_migration_routes forwards cache/progress/cancel as
# keyword-only knobs (cache added for F18's warm-read fix).
"packages/truestill-app/src/truestill_app/service/migrate.py" = ["PLR0913"]
# run_migration(catalog/destination/drive_uuid/template/apply/progress/cancel) as kw-only knobs.
"packages/truestill-core/src/truestill_core/migrate.py" = ["PLR0913"]
# create_app is an application factory: each route is a nested handler closing over the token/db.
"packages/truestill-app/src/truestill_app/server.py" = [
    "PLR0915", # the route handlers are defined inline inside the factory, by design
]
# Date parsing - EXIF timestamps are local wall-clock with no zone; naive datetimes correct.
"packages/truestill-core/src/truestill_core/dates.py" = [
    "DTZ007",  # strptime without %z is deliberate; EXIF has no reliable zone
    "PLR0911", # resolve_capture_datetime is a priority chain of early returns, by design
]
# Video UTC ladder - same naive wall-clock policy as dates.py; duration parser is shape-branchy.
"packages/truestill-core/src/truestill_core/video_utc.py" = [
    "DTZ007",  # device/GPS stamps are naive local or UTC digits without a zone field
    "PLR0911", # parse_duration branches on exiftool's several Duration shapes
]
# Destination backends shell out to rclone; that is the whole point of the wrapper.
"packages/truestill-core/src/truestill_core/destinations/rclone.py" = [
    "S603", # subprocess call is intentional
    "S607", # rclone is resolved from PATH by design
]
# Standalone benchmark/utility scripts: print is the output, and they bootstrap sys.path.
"scripts/**/*.py" = [
    "T201", "E402", "S311", "S603", "PLR2004", "DTZ001",
]
# Packaging-lane scripts run inside a CI step, where stdout IS how a verdict reaches the log and
# `::error::` annotations are how it reaches the run summary. Same latitude as scripts/, and for
# the same reason: there is no other output channel from a job step.
"packaging/**/*.py" = ["T201"]
# Tests can be more permissive
"packages/*/tests/**/*.py" = [
    "S101",    # Assert allowed in tests
    "PLR2004", # Magic values acceptable in tests
    "PLR0913", # Test helpers may take several args
    "PLR0917", # ... including positional
    "T201",    # Print statements allowed in tests
    "DTZ001",  # Naive datetimes are the subject under test (see dates.py rationale)
]
# Browser end-to-end suite. Same latitude as the other tests, plus the two it needs of its own.
"tests/e2e/**/*.py" = [
    "S101",    # Assert allowed in tests
    "PLR2004", # Fixture sizes (8 photos, 400 files) read better inline than as constants
    "PLR0913",
    "T201",
    "S603",    # subprocess: exiftool on generated fixtures, and `uv export` in the dep gate
    "S607",    # ... invoked by name, from PATH, exactly as the app itself does
]
# Measurement script: one instrumented pipeline pass, deliberately verbose.
"scripts/profile_organize_preview.py" = [
    "PLR0913",
    "PLR0915",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ⚠ **A FENCED ```python BLOCK IN A DOCUMENT IS A QUOTATION, NOT CODE - AND WITHOUT THIS LINE THE
# FORMATTER OWNS IT.** ruff 0.16 formats Python inside Markdown. Measured 2026-08-23 (`(agf)`):
# `free_bytes=need if free is None else free,` - a keyword argument quoted from `filesystem.py` -
# was rewritten to `free_bytes = (need if free is None else free,)`, a tuple assignment the file
# does not contain. It happened in `(age)`, whose entire subject is a value silently transformed
# one line after it was got right.
#
# **It is not only fragments.** A whole, valid statement is normalised too - `{'a': 1}` becomes
# `{"a": 1}` - so any block quoting source in a style other than ruff's is misquoted, less
# visibly.
#
# ⚠ **AND THE RECORDS ARE THE REAL EXPOSURE.** `docs/*research*.md` are never rewritten, by a rule
# this repo states twice; a formatter reaching inside one is that rule broken by a tool nobody
# would think to check. `trip-grouping-research.md` carries six such blocks.
#
# **Excluding costs nothing measurable.** An unparseable fragment is silently skipped rather than
# reported, so ruff offers no diagnostic value here - it only rewrites blocks that *do* parse,
# which is precisely the set where the rewrite is wrong and invisible. A prose rule was refused
# for §4's twenty-seventh member's reason: this one cannot be forgotten.
exclude = ["*.md"]

# --- pytest ---------------------------------------------------------------------------
[tool.pytest.ini_options]
markers = [
  "shell: belongs to no screen - the React migration's early-warning set. Run after every island lands (`make e2e-shell`), because an island on a different screen changes the DOM around these without touching them.",
]
testpaths = [
    "packages/truestill-core/tests",
    "packages/truestill-cli/tests",
    "packages/truestill-app/tests",
]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
# A green run's scratch has no reader - censused 2026-08-23 (P31): nothing in packages/,
# scripts/ or docs/ reads a retained passing run - so only failures keep their evidence.
# Steady state fell from ~1 GB (three retained green runs at ~336 MB) to ~0 on the suite's
# ext4 scratch (`suite_scratch.py`).
tmp_path_retention_policy = "failed"
# `--durations=15` prints the slowest fifteen after every run. The 90 s ceiling
# (`TEST_SECONDS_MAX`) is enforced against the whole suite and says nothing about which test
# spent it; this does, at no cost and with no plugin.
#
# ⚠ THE TRAP, RECORDED SO NOBODY CONCLUDES THE FLAG DOES NOTHING: `--durations` HIDES ANYTHING
# UNDER 0.005 s. On a suite where most of 2,505 tests are sub-millisecond, the output is a short
# list and a line reading "(N durations < 0.005s hidden)" - which reads as broken rather than as
# fast. `-vv` shows every test; `--durations-min=X` moves the threshold. Neither is the default,
# because the interesting answer is the tail and a full list of 2,505 timings is not readable.
#
# ⚠ AND UNDER `-n auto` THE NUMBERS ARE PER-TEST COST, NOT WALL CLOCK. Sixteen workers run at
# once, so the durations will not sum to the run time and are not meant to.
addopts = "-v --tb=short --durations=15"
# A warning is a failure, with two named exceptions. A suite that prints a warnings summary
# every run trains everyone to skim past it, which is exactly where the next real deprecation
# hides - the httpx one sat in that summary for as long as it took someone to read it on
# purpose. Erroring makes the next one arrive as a failing build instead.
#
# The two exceptions are deliberate and narrow, not a way to keep the gate green:
#
#   ResourceWarning is about WHEN the garbage collector runs, not about an API. Test fixtures
#   that bind a socket or open a catalog emit it depending on collection timing, so erroring on
#   it would make the suite fail intermittently for reasons unrelated to the code under test.
#   Turning a real deprecation gate into a flaky one is how gates get switched off.
#
#   PytestUnraisableExceptionWarning is pytest re-raising exactly those from a finalizer, so it
#   is the same exception wearing pytest's coat. It is exempted ONLY when the text it carries
#   ends in a ResourceWarning, because that category wraps *any* unraisable exception - and a
#   blanket exemption launders a real deprecation raised from __del__ into a printed warning
#   that does not fail. That was demonstrated, not theorised, and
#   `test_warning_gate_has_no_hole.py` is the permanent guard against it reopening.
#
#   The regex needs the inline `(?s)` DOTALL flag: the message pytest builds is a multi-line
#   traceback whose final line names the wrapped exception, and `.` does not cross newlines by
#   default. It carries no literal `:` on purpose - pytest splits these entries on colons.
filterwarnings = [
    "error",
    "default::ResourceWarning",
    'default:(?s).*\nResourceWarning:pytest.PytestUnraisableExceptionWarning',
]

# --- mypy -----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.14"
# Resolve workspace packages from source rather than from an installed copy, so mypy gives the
# same answer in an isolated pre-commit env as it does under `uv run`. Without this, the
# pre-commit hook cannot see `truestill_core` at all -- and its upstream default args include
# `--ignore-missing-imports`, so it answered "fine" to an import of a module that had not
# existed for two renames. Overriding those args (below) is only safe because of this line.
# `tests/e2e` is here for RESOLUTION, not to put tests in the fence - §6 keeps them out, and
# mypy still only checks what the Makefile names. `scripts/shoot_screens.py` imports
# `e2e_support.boot_app` deliberately (one server, two callers), and without this mypy would
# resolve it to `Any` and type-check nothing about that call.
mypy_path = "packages/truestill-core/src:packages/truestill-cli/src:packages/truestill-app/src:packaging:tests/e2e"
# ENGINEERING_STANDARD.md §4: mypy strict is mandatory. The gate and the claim must agree.
strict = true

# imagehash ships no type stubs; Pillow's are partial; pillow-heif and send2trash ship none.
# send2trash is a REQUIRED runtime dependency of truestill-core as of 2026-08-04. It was an
# optional probe, and this comment said so for as long as that was true; the line is rewritten
# rather than left because a comment asserting the opposite of the dependency list is the drift
# shape BACKLOG records twice already (`ALL_RULES`, `check_product_name.SUBCOMMANDS`).
# Why it is required rather than probed: see the dependency's own comment in
# packages/truestill-core/pyproject.toml and §7 of IMPLEMENTATION_STANDARDS.md.
[[tool.mypy.overrides]]
# fontTools is not a project dependency at all: `scripts/build_brand_assets.py` is a
# one-shot authoring tool run with `uv run --with fonttools --with pillow`. It is in the
# mypy fence because §6 puts every script there, so its imports need an entry here.
module = [
    "imagehash",
    "PIL",
    "PIL.*",
    "pillow_heif",
    "send2trash",
    "fontTools.*",
    # `packaging/verify_icon.py` reads PE resources with pefile, and locates PyInstaller's own
    # default icon to prove the shipped executable is not still wearing it. Neither ships stubs;
    # `types-pyinstaller` exists but would be a dependency taken for one `__file__` lookup.
    "pefile",
    "PyInstaller",
    # NOT a stub gap - Playwright ships its own types, and under `uv run` mypy finds and uses
    # them. This is about the pre-commit hook's ISOLATED environment, which installs mypy alone:
    # once `tests/e2e` joined `mypy_path` for `scripts/shoot_screens.py`, the hook began
    # following into `e2e_support` and could not resolve its Playwright import. The alternative
    # was `additional_dependencies: [playwright]` on the hook, which would pull a browser driver
    # into every commit for one import line. Per module, never a blanket flag (§6).
    "playwright.*",
    # NOT a stub gap either - pynacl ships `py.typed` (verified in the venv), and under `uv run`
    # mypy finds and uses it. Same isolated-environment case as playwright one line up: the
    # pre-commit hook installs mypy alone, so it cannot resolve an import of a package it never
    # installed, and `make check` was green while the hook was red. The alternative,
    # `additional_dependencies: [pynacl]` on the hook, would compile a libsodium binding into
    # every commit for three import lines. Per module, never a blanket flag (§6).
    "nacl.*",
]
ignore_missing_imports = true
