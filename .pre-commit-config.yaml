# Hooks are run by prek (a drop-in for pre-commit that reads this file; it builds hook environments with uv).
# Run against staged changes with: uv run prek run --all-files
# Install the git hook with:       uv run prek install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
        # --target-version py313: this repo does not adopt PEP 758 - `except (A, B):` keeps its
        # parentheses because the unparenthesised form is visually identical to Python 2's
        # `except E, name:`. The reason lives in pyproject.toml beside `target-version`.
        args: [--target-version, py313]
        # Markdown too. `ruff format` formats python blocks *inside* markdown, so a docs-only
        # commit can pass this hook (default types are python/pyi only) and then fail
        # `make check`, which runs the same formatter over everything. That is exactly what
        # happened to b5cba4a. Widening the hook's file types closes the gap at the commit.
        types_or: [python, pyi, markdown]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        # Match the repo's strict config: every workspace member's src/, plus scripts/,
        # packaging/ and the two root modules - but not tests.
        #
        # ⚠ THE COMMENT HERE CLAIMED THE THREE SETS WERE IDENTICAL AND THEY WERE NOT ((aga),
        # 2026-08-23). It read "keep in step with `make typecheck` and the CI mypy step, which
        # cover exactly this set" while this regex omitted `packaging/`, which both of the
        # others have checked since it was added. **A false claim in the place designed to
        # prevent that drift** - the sentence asserting the sets agree is what stopped anyone
        # comparing them. Stated rather than quietly corrected, because the failure is the
        # shape and not the missing directory.
        #
        # It stays prose, and that is a known residual: nothing executes this comparison, so
        # the next divergence is found the same way this one was - by somebody asking. Making
        # it a check means teaching a test to parse a Makefile, a workflow and a regex.
        files: ^(packages/(truestill-core|truestill-cli|truestill-app)/src/|scripts/|packaging/|[^/]+\.py$)
        # Override the upstream default args, which are `--ignore-missing-imports
        # --scripts-are-modules`. The first silently answers "fine" to an import that cannot
        # be resolved -- which is precisely how `scripts/benchmark_hashing.py` kept importing
        # a module that had not existed since the vaeon -> truestill rename. Workspace
        # packages resolve via `mypy_path` in pyproject.toml; third-party stub gaps are
        # handled per-module there, not by a blanket flag.
        args: []
        # uvicorn was missing here and nothing noticed, because the blanket
        # --ignore-missing-imports above was answering for it.
        # `pytest` is here for the root `conftest.py`, and it is the WHOLE cost of widening:
        # the two errors that appeared were "cannot find pytest" and the untyped-decorator that
        # follows from it, both in the isolated env only. Under `uv run mypy` the pair reports
        # zero either way.
        # msgspec: `scripts/emit_openapi.py` imports it (`(ahn)` stage C), so the isolated env
        # must know it or the hook refuses a commit `make check` passed. Found that way 2026-09-03.
        additional_dependencies: [imagehash, msgspec, pillow, platformdirs, pytest, starlette, uvicorn]

  - repo: local
    hooks:
      - id: dash-style
        name: no em-dashes, and no mangled "word- word" dashes
        entry: python3 scripts/normalize_dashes.py --check
        language: system
        pass_filenames: false
        types_or: [python, markdown, toml, yaml]
      # ⚠ always_run, NOT a `types_or` list, and the difference is the point. `types_or`
      # decides only WHETHER a hook fires; with `pass_filenames: false` it never scopes what
      # the script reads. This one read five declared file types and 13 hand-listed paths, so
      # the declaration claimed a reach it did not have - found 2026-08-25.
      # The reach stays the shop window ON PURPOSE, and the number is the argument: the full
      # sweep of those five types finds 367 lines in 146 files, of which 35 files are RECORDS
      # this repo forbids rewriting. `scripts/check_product_name.py` CHECKED is the list, and
      # `test_the_product_name_guard_declares_its_reach.py` pins this.
      - id: product-name
        name: the product name is "Truestill" on the 13 surfaces a user reads
        entry: python3 scripts/check_product_name.py
        language: system
        pass_filenames: false
        always_run: true
      # Accidental ``> 25.9`` / ``-> 2024-03-24`` shell redirects land empty files at the root.
      # always_run so a previously committed artifact is caught even when untouched.
      - id: no-redirect-artifacts
        name: no shell-redirect artifact filenames at repo root
        entry: python3 scripts/check_redirect_artifacts.py
        language: system
        pass_filenames: false
        always_run: true

  # Portable golden rule (docs/GOLDEN_REPO_RULES.md §1): no AI co-author trailer /
  # Anthropic/Claude email in history. Activate with:
  #   uv run prek install --hook-type commit-msg
  - repo: local
    hooks:
      - id: no-ai-coauthor
        name: block AI co-author / Anthropic-Claude signature in commit message
        entry: python3 scripts/check_commit_msg.py
        language: system
        stages: [commit-msg]
      # The other direction of the closure rule. A letter that LEAVES BACKLOG.md must be
      # declared closed in this commit's message and must arrive in SHIPPED.md in the same
      # commit. It is a hook rather than a test because the corpus form is not honestly
      # checkable - 31 of SHIPPED.md's 32 entries predate the trailer, and a guard that goes
      # red on the past gets switched off. Reads only the staged diff, so it has no past.
      - id: entry-closure
        name: an entry that leaves the backlog is closed, and closed in this commit
        entry: python3 scripts/check_entry_closure.py
        language: system
        stages: [commit-msg]
      # §2's "a pending result outranks a ready batch" carries TWO obligations - contention (do
      # not cancel a run in flight) and OUTCOME (do not push onto a red one) - and only the first
      # was ever honoured, because nobody had separated them. Broken on 2026-08-21: three commits
      # landed on an already-red main. Refuses rather than waits, and
      # `TRUESTILL_PUSH_ANYWAY=1 git push` is how you say you mean it.
      # Activate with: uv run prek install --hook-type pre-push
      #
      # ⚠ **THE NAME IS A SUBJECT, NOT A CLAIM, and it used to be a claim.** pre-commit prints
      # `<name> ... Passed` whenever a hook exits 0 - including when it was overridden or fell
      # open - and it SUPPRESSES a passing hook's own output. So the old name, "the last push's
      # run is finished and green", was rendered as an assertion of a fact nothing had checked.
      # Measured 2026-08-23: a push onto a red tip showed exactly that line and nothing else.
      # `(agn)`
      #
      # ⚠ THE CONSTRAINT, learned twice (the override's report, then the gate's own "NOT gated"
      # confession while it ran inert - P33): A HOOK MESSAGE THAT MATTERS MUST RIDE A NON-ZERO
      # EXIT. There is no channel by which a passing hook can say something a person will see.
      # Do not write a warn-and-exit-0 branch in any hook here; it is a message to nobody.
      #
      # ⚠ RULED 2026-08-24, reversing the 2026-08-23 per-instance-human ruling: when the push
      # IS the fix for the red tip the gate is refusing, the agent runs
      # TRUESTILL_PUSH_ANYWAY=1 itself rather than handing the command to a human. The gate is
      # thereby advisory to the agent for exactly the fix-onto-red case and binding for every
      # other refusal (contention, unknown tip, someone else's red). The override line printing
      # under `verbose: true` is what keeps this auditable.
      #
      # ⚠ AND THE OVERRIDE IS SPLIT (P38, same day - its first exercise cancelled a live run):
      # TRUESTILL_PUSH_ANYWAY waives the OUTCOME check only; contention now WAITS bounded
      # (480s) and then refuses under it. Cancelling a run in flight is its own decision with
      # its own name - TRUESTILL_PUSH_CANCELS_THE_RUN=1 - and the audit lines say which check
      # each one waived, because "nothing was verified" overstated what was skipped.
      #
      # ⚠ (Measured under pre-commit; prek 0.5.7 behaves the same, checked 2026-10-31 by
      # test_push_gate_runs_under_prek.py.) And pre-commit DOES NOT FORWARD git's pre-push stdin to hooks (observed: a probe hook
      # read `stdin:[]` while git had supplied the ref line). Subjects come from
      # PRE_COMMIT_FROM_REF (the REMOTE tip sha), PRE_COMMIT_TO_REF (the local sha) and
      # PRE_COMMIT_REMOTE_BRANCH - which is why the gate fell inert from a173c42 until P33.
      - id: push-gate
        name: push gate (the tip you are pushing onto)
        entry: python3 scripts/check_push_gate.py
        language: system
        pass_filenames: false
        always_run: true
        # The one exception to "a message that matters must ride a non-zero exit", and the
        # correction to it: `verbose: true` is pre-commit's opt-in voice for a PASSING hook.
        # Without it the override's "OVERRIDDEN ... nothing was verified" line and the
        # fail-open "NOT gated" warnings were suppressed under `Passed` - observed live on
        # 2026-08-24, on the override push this gate's own rearming needed.
        verbose: true
        stages: [pre-push]
