[project]
name = "truestill-cli"
version = "0.1.1"
description = "Command-line interface for Truestill: organize, de-duplicate and back up a media library."
authors = [{ name = "Truestill contributors" }]
requires-python = ">=3.14"
readme = "README.md"
license = "LicenseRef-PolyForm-Strict-1.0.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
    "Topic :: System :: Archiving :: Backup",
]
dependencies = [
    "truestill-core",
]

[project.scripts]
truestill = "truestill_cli.cli:main"

[project.urls]
Homepage = "https://github.com/dinesh-ad/truestill"
Repository = "https://github.com/dinesh-ad/truestill"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/truestill_cli"]

# Resolve the truestill-core dependency from this workspace rather than PyPI.
[tool.uv.sources]
truestill-core = { workspace = true }
