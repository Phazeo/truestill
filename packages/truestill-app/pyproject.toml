[project]
name = "truestill-app"
version = "0.1.1"
description = "Local web UI for Truestill: a Starlette server + browser front-end on localhost."
authors = [{ name = "Truestill contributors" }]
requires-python = ">=3.14"
readme = "README.md"
license = "LicenseRef-PolyForm-Strict-1.0.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
]
# Deps isolated to this package; truestill-core stays imagehash+pillow only.
#   starlette -- minimal ASGI (routing + SSE + static + background); not FastAPI (wraps
#     Starlette+Pydantic; Pydantic is disallowed for our models and unneeded for one user).
#     ⚠ msgspec, in the root dev group since 2026-09-03, is NOT an exception to this: it emits
#     JSON Schema from the TypedDicts at build time and is never imported by the app. `(ahn)` C.
#   uvicorn -- the ASGI server to run Starlette (no stdlib ASGI server exists).
# The browser front-end is server-rendered HTML plus TWO client layers, and this sentence used
# to claim there was only one.
#   * `static/app.js` - the original vanilla layer (EventSource for SSE, fetch for the API).
#   * `static/dist/main.js` - a React 19 island built by Vite from `frontend/`, which OWNS the
#     `#org-result` region. As of the twelve-writers refactor it is not merely a bundled file
#     sitting inert beside the page: React renders a live region of the running UI.
#   * `static/dist/main.css` - Tailwind v4's output, added 2026-08-15 and emitted by the same
#     build. It carries NO values of its own: every utility resolves to a `var()` declared in
#     `tokens.css`, which stays the single source. Preflight is deliberately not imported, so it
#     adds utilities and resets nothing. Linked from the template AFTER `app.css`, so a redesigned
#     surface can reach for a utility and win.
# ⚠ REVERSED, not tidied. This line read "no npm/bundler/build step, and no third-party CODE to
# vendor" and every clause of it is now false: `frontend/package-lock.json` exists, `make
# frontend` runs `tsc --noEmit && vite build`, and React is BUNDLED into `static/dist/` at build
# time and carried by the wheel (`packages = ["src/truestill_app"]` sweeps it in).
#   ⚠ BUNDLED, not vendored, corrected 2026-08-15: `static/dist/` is GITIGNORED and `git ls-files`
#   returns ZERO bytes of it, so the repository vendors no React. The distinction is not pedantry -
#   the sentence four lines down says one third-party ASSET *is* vendored, and that one is real
#   (three tracked files under `static/fonts/`). Using the same word for both made a build output
#   look like committed third-party code.
# The ruling this line recorded was real and was overturned deliberately - see
# `docs/react-migration-plan.md`. Node is required for the browser lane, never for `make check`.
# One third-party ASSET is vendored: DejaVu Sans Mono (Book + Bold) in static/fonts/, because
# the monospace stack resolved to a different face on every OS. Bitstream Vera licence and
# upstream checksums ship beside it. Not a pip dependency; no build step; no network.
dependencies = [
    "truestill-core",
    "starlette>=1.3.1",
    "uvicorn>=0.51.0",
]

[project.scripts]
truestill-app = "truestill_app.__main__:main"

[project.urls]
Homepage = "https://github.com/dinesh-ad/truestill"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/truestill_app"]

[tool.uv.sources]
truestill-core = { workspace = true }
