[project]
name = "truestill-core"
version = "0.1.1"
description = "Core library: categorize, date, de-duplicate and place media into a Category/YYYY/MM tree."
authors = [{ name = "Truestill contributors" }]
# 3.14 because 3.13 leaves BUGFIX support in October 2026 - two years after its release, when
# "only security fixes are accepted and no more binaries are released" (devguide). The floor
# tracks what upstream still builds binaries for, not the last date a CVE would be patched.
# ⚠ This said 3.13 "to match what CI actually exercises"; CI has exercised BOTH since the 3.14
# leg was added, green on every run, which is what made the move a bump rather than a gamble.
requires-python = ">=3.14"
readme = "README.md"
license = "Apache-2.0"
keywords = ["photos", "media", "organizer", "deduplication", "backup", "exif"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
    "Topic :: System :: Archiving :: Backup",
    "Typing :: Typed",
]

# Metadata is read by shelling out to the `exiftool` binary (Ubuntu: libimage-exiftool-perl).
# Runtime Python deps are limited to perceptual hashing (imagehash on Pillow); SHA-256 and
# SQLite use the stdlib.
dependencies = [
    # Only stdlib-unavailable need here: the three OS conventions for user data and
    # cache directories. Argued in writing at `app_paths.py` per ENGINEERING_STANDARD 4.
    "platformdirs>=4.11.0",
    "imagehash>=4.3.2",
    # Imported directly by `dedup.py` for the packed perceptual match, so it is declared
    # rather than leaned on transitively. Argued in §7 of IMPLEMENTATION_STANDARDS.md.
    "numpy>=2.5.1",
    "pillow>=13.0.0",
    "pillow-heif>=1.5.0",
    # Required, not probed. It was an optional import until 2026-08-04, and "optional" is what
    # made an absent trash backend a *destructive* state rather than a degraded one: with no
    # send2trash and no `gio`, `cleanup.trash_backend` returned None and folders were removed
    # outright. `gio` is a GLib tool, so that was the ordinary condition on Windows and macOS.
    # Pure `py3-none-any` wheel, BSD-3-Clause, no required dependencies of its own. Argued in
    # §7 of IMPLEMENTATION_STANDARDS.md.
    "send2trash>=2.1.0",
    # Ed25519 signature VERIFICATION for licence tokens (`licence.py`). D6 §2 chose the
    # algorithm; this is the choice of binding, and it is a D7 decision because D7 forbids a
    # copyleft dependency in a published package without an explicit superseding one.
    #
    # **Apache-2.0** (PyPI metadata, checked 2026-09-11) - the same licence as this project, so
    # D7 is satisfied outright rather than by argument. The alternative, `cryptography`, is
    # `Apache-2.0 OR BSD-3-Clause` and also clears D7; the choice between them was made on
    # surface, not licence:
    #
    #   - **42 advisories against 2.** OSV, 2026-09-11: `cryptography` carries 42, `pynacl` 2 -
    #     and both of pynacl's are the same libsodium issue, fixed in 1.6.2, which is this floor.
    #     The asymmetry is structural rather than a run of luck: `cryptography`'s wheels
    #     statically link OpenSSL, so every OpenSSL advisory becomes a `cryptography` advisory
    #     and a `pip-audit` red here. This lane already went red on transitive CVEs on
    #     2026-09-09; taking on a bundled TLS stack to verify a 64-byte signature buys that
    #     class of red for ever.
    #   - **1.4 MB against 4.7 MB** (manylinux x86_64 wheels of the current releases). Both ship
    #     abi3 wheels covering 3.14 on every platform D9 publishes.
    #   - **The surface is the primitive.** libsodium's signing API is what is needed; an X.509
    #     parser, a PKCS12 loader and a TLS implementation are not, and every one of them is a
    #     place `cryptography` has had a CVE.
    #
    # ⚠ The honest counter-argument, recorded rather than omitted: **pynacl went 3.5 years
    # between 1.5.0 (2022-01) and 1.6.0 (2025-09)**, which is the risk in choosing it. It is
    # maintained by PyCA - the same organisation that maintains `cryptography` - and has shipped
    # three releases in the four months since, so it is not abandoned. If it stalls again the
    # exit is cheap, because `licence.py` touches exactly two calls of it.
    "pynacl>=1.6.2",
]

[project.urls]
Homepage = "https://github.com/dinesh-ad/truestill"
Repository = "https://github.com/dinesh-ad/truestill"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/truestill_core"]
